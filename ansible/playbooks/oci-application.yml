---
- name: Configure BobHub OCI application server
  hosts: oci_app
  become: true

  tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - docker.io
          - curl
          - python3-docker
          - postgresql-client
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to Docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create BobHub application directory
      ansible.builtin.file:
        path: /opt/bobhub-app
        state: directory
        mode: "0755"

    - name: Copy BobHub application source
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/bobhub-app/"
        dest: /opt/bobhub-app/
        mode: "0644"
        directory_mode: "0755"

    - name: Build BobHub application image 
      community.docker.docker_image:
        name: bobhub-app
        tag: v0.3.0
        source: build
        build:
          path: /opt/bobhub-app

    - name: Create BobHub Docker network
      community.docker.docker_network:
        name: bobhub
        state: present

    - name: Run Traefik
      community.docker.docker_container:
        name: traefik
        image: traefik:v3
        state: started
        restart_policy: unless-stopped
        networks:
          - name: bobhub
        published_ports:
          - "80:80"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
        command:
          - --providers.docker=true
          - --providers.docker.exposedbydefault=false
          - --entrypoints.web.address=:80

    - name: Run BobHub application
      community.docker.docker_container:
        name: bobhub-app
        image: bobhub-app:v0.3.0
        state: started
        restart_policy: unless-stopped
        recreate: true

        networks:
          - name: bobhub

        env:
          APP_CLOUD: "oci"
          APP_HOSTNAME: "{{ ansible_hostname }}"
          APP_PRIVATE_IP: "{{ ansible_default_ipv4.address }}"

          DB_HOST: "{{ lookup('env', 'BOBHUB_DB_HOST') }}"
          DB_NAME: "{{ lookup('env', 'BOBHUB_DB_NAME') }}"
          DB_USER: "{{ lookup('env', 'BOBHUB_DB_USER') }}"
          DB_PASSWORD: "{{ lookup('env', 'BOBHUB_DB_PASSWORD') }}"

        labels:
          traefik.enable: "true"
          traefik.http.routers.bobhub.rule: "PathPrefix(`/`)"
          traefik.http.routers.bobhub.entrypoints: "web"
          traefik.http.services.bobhub.loadbalancer.server.port: "8000"

      no_log: true
