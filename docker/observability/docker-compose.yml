services:

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    environment:
      GF_SERVER_ROOT_URL: "https://grafana.kernelcoffe.online"
      GF_SERVER_DOMAIN: "grafana.kernelcoffe.online"

    volumes:
      - grafana-data:/var/lib/grafana

    networks:
      - default
      - bobhub-proxy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus

    networks:
      - default
      - bobhub-proxy

    depends_on:
      - node-exporter
      - alertmanager

  alertmanager: 
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped

    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../alertmanager/discord-webhook.url:/etc/alertmanager/discord-webhook.url:ro
      - alertmanager-data:/alertmanager

    networks:
      - default
      - bobhub-proxy

    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped

    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'

    volumes:
      - /:/host:ro,rslave

volumes:
  grafana-data:
  prometheus-data:
  alertmanager-data:

networks:
  bobhub-proxy:
    external: true