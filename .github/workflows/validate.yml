name: BobHub CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate BobHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Bash scripts
        shell: bash
        run: |
          echo "Validating BobHub shell scripts..."

          while IFS= read -r -d '' script; do
            echo "Checking $script..."
            bash -n "$script"
          done < <(find scripts -type f -name "*.sh" -print0)

      - name: Validate Docker Compose files
        shell: bash
        run: |
          echo "Searching for Docker Compose files..."

          find . \
            \( -name "docker-compose.yml" \
            -o -name "docker-compose.yaml" \
            -o -name "compose.yml" \
            -o -name "compose.yaml" \) \
            -print

      - name: BobHub validation summary
        run: |
          echo "BobHub validation completed successfully."

  finalize:
    name: Finalize linked issue
    needs: validate

    if: github.event_name == 'push' && needs.validate.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Close linked issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"

          ISSUE_NUMBER="$(
            printf '%s\n' "$COMMIT_MESSAGE" |
            sed -nE 's/^[[:space:]]*Issue:[[:space:]]*#([0-9]+)[[:space:]]*$/\1/p' |
            head -n 1
          )"

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No linked issue found in commit message."
            exit 0
          fi

          echo "Linked issue found: #$ISSUE_NUMBER"

          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --reason completed \
            --comment "Closed automatically after BobHub CI completed successfully for commit $GITHUB_SHA."